version: '3.8'

services:
  mongo:
    image: mongo:8.0
    container_name: pa-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=pa_user
      - MONGO_INITDB_ROOT_PASSWORD=pa_secure_password_change_me

  # App service (FastAPI) - wird später ergänzt
  # app:
  #   build: .
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - mongo

volumes:
  mongo_data:
