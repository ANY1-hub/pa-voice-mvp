version: '3.8'

services:
  mongo:
    image: mongo:8.0
    container_name: pa-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=pa_admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

  app:
    build: .
    container_name: pa-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - MONGODB_URI=${LOCAL_MONGODB_URI}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=change_this_to_a_secure_secret_in_production
    depends_on:
      - mongo

volumes:
  mongo_data:
