name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            **/requirements*.txt

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Black
        run: black --check src tests

      - name: Pytest
        env:
          SECRET_KEY: "ci-test-secret-key-do-not-use-in-prod!"
          MONGODB_URI: "mongodb://localhost:27017"
          MONGODB_DB_NAME: "jarvis_test"
        # --cov-fail-under enforces a minimum total coverage (currently ~86%+).
        # STT/ffmpeg paths stay low on purpose; overall floor keeps regressions in check.
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80
