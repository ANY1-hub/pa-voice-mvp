<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2b J.A.R.V.I.S.</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Login -->
    <div id="loginScreen" class="screen">
        <div class="login-card">
            <div class="logo">2b J.A.R.V.I.S.</div>
            <p class="tagline">to be Just A Rather Will Very Intelligent System</p>

            <form id="loginForm">
                <div class="field">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required autocomplete="username" placeholder="tony@stark.com">
                </div>
                <div class="field">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Initialize</button>
            </form>
            <p id="loginError" class="error-msg hidden"></p>
        </div>
    </div>

    <!-- Main App -->
    <div id="appScreen" class="screen hidden">
        <header class="top-bar">
            <div class="brand">2b J.A.R.V.I.S.</div>
            <div class="user-area">
                <span id="speakingIndicator" class="speaking-indicator hidden" title="Speaking…" aria-live="polite">
                    <svg class="speaker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    </svg>
                    <span class="speaking-label">Speaking</span>
                </span>
                <span id="userLabel" class="user-label"></span>
                <button id="logoutBtn" class="btn-ghost">Logout</button>
            </div>
        </header>

        <main id="chatContainer" class="chat-area"></main>

        <div id="statusLine" class="status-line hidden"></div>

        <footer class="input-area">
            <div class="speak-wrapper">
                <button id="speakBtn" class="speak-btn" aria-label="Speak">
                    <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                    <span id="recIndicator" class="rec-dot hidden"></span>
                </button>
                <span id="speakHint" class="speak-hint">Click to speak</span>
            </div>

            <div class="text-row">
                <input type="text" id="textInput" placeholder="Or type a command…" autocomplete="off">
                <button id="sendBtn" class="btn-send">Send</button>
            </div>
        </footer>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
