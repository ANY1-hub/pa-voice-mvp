<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2b J.A.R.V.I.S.</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Auth (Login / Bootstrap Register) -->
    <div id="authScreen" class="screen">
        <div class="login-card">
            <div class="logo">2b J.A.R.V.I.S.</div>
            <p class="tagline">to be Just A Rather Will Very Intelligent System</p>

            <!-- Login form (default) -->
            <form id="loginForm">
                <div class="field">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required autocomplete="username" placeholder="tony@stark.com">
                </div>
                <div class="field">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Initialize</button>
            </form>

            <!-- Bootstrap register (only when needs_bootstrap) -->
            <form id="registerForm" class="hidden">
                <p class="auth-hint">First setup – create the SuperUser account</p>
                <div class="field">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" required autocomplete="username" placeholder="tony@stark.com">
                </div>
                <div class="field">
                    <label for="regPassword">Password (min 12)</label>
                    <input type="password" id="regPassword" required minlength="12" autocomplete="new-password" placeholder="••••••••••••">
                </div>
                <div class="field">
                    <label for="regPassword2">Confirm password</label>
                    <input type="password" id="regPassword2" required minlength="12" autocomplete="new-password" placeholder="••••••••••••">
                </div>
                <button type="submit" class="btn-primary">Create SuperUser</button>
            </form>

            <p id="authError" class="error-msg hidden"></p>
            <p id="authSuccess" class="success-msg hidden"></p>
        </div>
    </div>

    <!-- Forced password change -->
    <div id="changePasswordScreen" class="screen hidden">
        <div class="login-card">
            <div class="logo">Password Change</div>
            <p class="tagline">You must set a new password before continuing</p>
            <form id="changePasswordForm">
                <div class="field">
                    <label for="currentPassword">Current password</label>
                    <input type="password" id="currentPassword" required autocomplete="current-password">
                </div>
                <div class="field">
                    <label for="newPassword">New password (min 12)</label>
                    <input type="password" id="newPassword" required minlength="12" autocomplete="new-password">
                </div>
                <div class="field">
                    <label for="newPassword2">Confirm new password</label>
                    <input type="password" id="newPassword2" required minlength="12" autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary">Update Password</button>
            </form>
            <p id="changePasswordError" class="error-msg hidden"></p>
        </div>
    </div>

    <!-- Main App -->
    <div id="appScreen" class="screen hidden">
        <header class="top-bar">
            <div class="brand">2b J.A.R.V.I.S.</div>
            <div class="user-area">
                <span id="speakingIndicator" class="speaking-indicator hidden" title="Speaking…" aria-live="polite">
                    <svg class="speaker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    </svg>
                    <span class="speaking-label">Speaking</span>
                </span>
                <button id="adminBtn" class="btn-ghost hidden">Admin</button>
                <span id="userLabel" class="user-label"></span>
                <button id="logoutBtn" class="btn-ghost">Logout</button>
            </div>
        </header>

        <main id="chatContainer" class="chat-area"></main>

        <div id="statusLine" class="status-line hidden"></div>

        <footer class="input-area">
            <div class="speak-wrapper">
                <button id="speakBtn" class="speak-btn" aria-label="Speak">
                    <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                    <span id="recIndicator" class="rec-dot hidden"></span>
                </button>
                <span id="speakHint" class="speak-hint">Click to speak</span>
            </div>

            <div class="text-row">
                <input type="text" id="textInput" placeholder="Or type a command…" autocomplete="off">
                <button id="sendBtn" class="btn-send">Send</button>
            </div>
        </footer>
    </div>

    <!-- Admin Panel (overlay) -->
    <div id="adminPanel" class="admin-overlay hidden">
        <div class="admin-card">
            <div class="admin-header">
                <h2>User Management</h2>
                <button id="adminCloseBtn" class="btn-ghost">Close</button>
            </div>

            <section class="admin-section">
                <h3>Create user</h3>
                <form id="adminCreateForm" class="admin-form">
                    <div class="field">
                        <label for="adminEmail">Email</label>
                        <input type="email" id="adminEmail" required placeholder="user@example.com">
                    </div>
                    <div class="field">
                        <label for="adminPassword">Initial password (min 12)</label>
                        <input type="password" id="adminPassword" required minlength="12" placeholder="••••••••••••">
                    </div>
                    <div class="admin-flags">
                        <label class="checkbox-label">
                            <input type="checkbox" id="adminIsSuperuser"> SuperUser
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="adminIsActive" checked> Active
                        </label>
                    </div>
                    <button type="submit" class="btn-primary">Create</button>
                </form>
                <p id="adminCreateError" class="error-msg hidden"></p>
                <p id="adminCreateSuccess" class="success-msg hidden"></p>
            </section>

            <section class="admin-section">
                <h3>Users</h3>
                <div id="adminUserList" class="admin-user-list">
                    <p class="text-muted">Loading…</p>
                </div>
            </section>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
