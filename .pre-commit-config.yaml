repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix]
      # Do not add ruff-format: Black is the formatter. The two disagree
      # on assert-paren wrapping and page.evaluate() line breaks.

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: mvp-closeout-screenshots
        name: MVP closeout screenshots
        entry: uv run --no-sync pytest tests/test_mvp_closeout.py -q --no-cov -k "screenshot or precommit or local_readme_image"
        language: system
        files: README.md|docs/images/
        pass_filenames: false
