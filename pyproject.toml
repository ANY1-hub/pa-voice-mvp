[project]
name = "pa-voice-mvp"
version = "0.1.0"
description = "Voice-first Personal Assistant MVP (Jarvis-like) with neuro-inspired memory"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Your Name" }]

[project.dependencies]
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pymongo = "^4.8.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
apscheduler = "^3.10.4"

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
]
test = [
    "pytest",
    "pytest-cov",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = ["tests"]
