# Package manager: uv only. pyproject.toml + uv.lock are the source of truth.
# Docker: uv sync --frozen --no-dev (no requirements.txt).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pa-voice-mvp"
version = "0.1.0"
description = "Voice-first Personal Assistant MVP (Jarvis-like) with neuro-inspired memory"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Your Name" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pymongo>=4.8.0",
    "motor>=3.4.0",
    "pyjwt[crypto]>=2.8.0",
    "bcrypt>=4.0.0,<4.1",
    "passlib[bcrypt]>=1.7.4",
    "openai>=1.40.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "python-multipart>=0.0.9",
    "imageio-ffmpeg>=0.5.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.22",
    "black==26.5.1",
    "mypy",
    "pytest",
    "httpx",
    "pytest-cov",
    "pytest-asyncio",
    "pre-commit",
    "playwright",
]
test = [
    "pytest",
    "httpx",
    "pytest-cov",
    "pytest-asyncio",
    "playwright",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/core/data/hungarian_given_names.json" = "src/core/data/hungarian_given_names.json"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
